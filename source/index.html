<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2335D9" />
    <title>Kavya Bhat · Dancer & Choreographer</title>
    <meta
      name="description"
      content="Kavya Bhat: Bharatanatyam-trained dancer, Waacking battle artist and choreographer based in London. Book her for shows, music videos and workshops."
    />
    <meta property="og:title" content="Kavya Bhat · Dancer & Choreographer" />
    <meta
      property="og:description"
      content="Eight years of Bharatanatyam gave me the foundation. Waacking gave me wings."
    />
    <meta property="og:image" content="./media/kavya.jpg" />
    <!-- her photo starts downloading during the intro so it's ready when the curtain lifts -->
    <link rel="preload" as="image" href="./media/kavya.webp" fetchpriority="high" />
    <!-- the intro screen is drawn by plain HTML/CSS so it appears before any code runs -->
    <style>
      body { margin: 0; background: #ff3d8b; }
      .boot { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: #ff3d8b; }
      .boot span { font: 400 clamp(7rem, 30vw, 20rem) / 1 'Shrikhand', 'Cooper Black', Georgia, serif; color: #ffd60a;
        text-shadow: 8px 8px 0 #15112e; animation: boot-pop 0.9s ease-in-out infinite alternate; }
      @keyframes boot-pop { from { transform: scale(0.92) rotate(-6deg); } to { transform: scale(1.04) rotate(4deg); } }
      @media (prefers-reduced-motion: reduce) { .boot { display: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without holding up the first paint -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Caveat:wght@600;700&family=Shrikhand&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><span>5</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
